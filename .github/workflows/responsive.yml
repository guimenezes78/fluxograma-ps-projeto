name: Verificação responsiva

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    name: Chromium · desktop e mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verificar conteúdo e unidade
        run: bun run test

      - name: Gerar build de produção
        run: bun run build

      - name: Verificar desktop e mobile
        run: bun run test:responsive

      - name: Anexar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
